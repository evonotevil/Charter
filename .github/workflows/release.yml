name: Electron desktop release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Check app, Electron and release versions
        shell: bash
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run build
      - name: Build Windows installer and portable ZIP
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Install and launch test
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows-x64
          if-no-files-found: error
          path: |
            desktop/release/Charter-*-Windows-Setup.exe
            desktop/release/Charter-*-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows-x64
          if-no-files-found: ignore
          path: |
            desktop/windows-smoke.json
            desktop/windows-smoke.png

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Check app, Electron and release versions
        shell: bash
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run build
      - name: Build ${{ matrix.arch }} app, DMG and ZIP
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify app, DMG and ZIP
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP=$(find release -maxdepth 3 -type d -name Charter.app -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Charter" | tee macos-architectures.txt
          case "$EXPECTED_ARCH" in
            arm64) grep -qw arm64 macos-architectures.txt ;;
            x64) grep -qw x86_64 macos-architectures.txt ;;
          esac
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$VERSION"
          test -f "$APP/Contents/Resources/app.asar"
          test -f "$APP/Contents/Resources/charter-templates.json"
          hdiutil verify "release/Charter-$VERSION-Mac-$EXPECTED_ARCH.dmg"
          unzip -tq "release/Charter-$VERSION-Mac-$EXPECTED_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/release/Charter-*-Mac-${{ matrix.arch }}.dmg
            desktop/release/Charter-*-Mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-macos-${{ matrix.arch }}
          if-no-files-found: ignore
          path: desktop/macos-architectures.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
      - name: Collect installers and checksums
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          python3 desktop/scripts/collect-release.py artifacts release "$VERSION"
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Charter ${RELEASE_TAG#v}" --notes-file desktop/RELEASE.md
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
