name: Deploy Charter website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "desktop/web-demo/**"
      - "desktop/src/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build interactive website
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm exec -- vite build --config web-demo/vite.config.ts

      - name: Preserve public assets and validate output
        run: |
          output=desktop/web-demo/dist
          cp -R site/assets/. "$output/assets/"
          test -f "$output/index.html"
          test -f "$output/workspace.html"
          test -f "$output/assets/charter-icon.png"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: desktop/web-demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
