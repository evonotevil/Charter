name: Deploy Charter website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate website assets
        run: |
          test -f site/index.html
          test -f site/assets/charter-icon.png
          test "$(find site/assets/screens -type f -name '*.png' | wc -l)" -eq 5
          test "$(find site/assets/store -type f -name '*.png' | wc -l)" -eq 5
          test "$(find site/assets/fonts -type f -name '*.woff2' | wc -l)" -eq 3

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
