[package]
name = "charter"
version = "3.0.1"
description = "Charter：海外子公司档案管理"
edition = "2021"

[lib]
name = "charter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tempfile = "3"
hostname = "0.4"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSError", "NSArray", "NSDictionary", "NSData", "NSValue", "NSObject", "NSFileManager"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation", "Foundation_Collections", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization",
  "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
